data:
    name: homographies
    data_dir: revisitop1m
    train_size: 1500 # 150000
    val_size: 64 # 2000
    batch_size: 64  #128
    num_workers: 8 # 1
    homography:
        difficulty: 0.7
        max_angle: 45
    photometric:
        name: lg
model:
    name: two_view_pipeline
    extractor:
        name: gluefactory_nonfree.superpoint
        max_num_keypoints: 512
        force_num_keypoints: True
        detection_threshold: 0.0
        nms_radius: 3
        trainable: False
    ground_truth:
        name: matchers.homography_matcher
        th_positive: 3
        th_negative: 3
    matcher:
        name: matchers.stickyglue
        pretrained_lightglue: "outputs/official/superpoint_lightglue.pth"
        filter_threshold: 0.1
        flash: true
        checkpointed: true
        memory_training:
            enabled: true
            buffer_size: 1000
            batch_size: 64
            margin: 0.2
            max_num_matches: 512
train:
    seed: 0
    epochs: 40
    log_every_iter: 100
    eval_every_iter: 500
    lr: 1e-4
    lr_schedule:
        start: 20
        type: exp
        on_epoch: true
        exp_div_10: 10
    plot: [5, 'gluefactory.visualization.visualize_batch.make_match_figures']
benchmarks:
    megadepth1500:
      data:
        preprocessing:
          side: long
          resize: 1600
      eval:
        estimator: opencv
        ransac_th: 0.5
    hpatches:
      eval:
        estimator: opencv
        ransac_th: 0.5
